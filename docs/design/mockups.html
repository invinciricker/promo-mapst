<!doctype html>
<!--
  Promo MAPST · Phase 3 « Nouveau look »: the target design.
  Written by Claude chat on 7 Nov 2026 for Claude Code to build. Read docs/design/README.md first.
  - The CSS variables in :root (light) and .dark (dark) are the design tokens:
    copy them into css/01-tokens.css (the dark ones go in @media (prefers-color-scheme: dark)).
  - Each <section class="phone"> is one screen at iPhone size (390 × 844), with the real data of the planning
    and the questions. The little script at the bottom only draws the iPhone status bars.
  - Open it through a local server from the repository root:
      python3 -m http.server 8000   then   http://localhost:8000/docs/design/mockups.html
-->
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Promo MAPST, nouveau look</title>
<style>
@font-face {
  font-family: "Plus Jakarta Sans";
  src: url("../../vendor/fonts/plus-jakarta-sans.woff2") format("woff2");
  font-weight: 200 800;
}

/* ================= Design tokens: light ================= */
:root {
  /* Surfaces are bright; CAPA navy is the text colour, not a background. */
  --bg: #F3F7FA;
  --surface: #FFFFFF;
  --surface-2: #EDF3F7;
  --line: #E1E9F0;
  --ink: #103550;
  --ink-2: #4F6680;
  --ink-3: #60738A;
  --on-accent: #FFFFFF;           /* text and icons on a filled --X-ink background */
  --scrim: rgba(16, 53, 80, .42); /* behind bottom sheets */

  /* Each colour comes in three: X (fills, bars, dots), X-ink (text and icons), X-tint (soft backgrounds).
     Every X-ink reads at 4.5:1 or more on its tint and on white (checked on 7 Nov 2026). */
  --azur: #1070B0;           --azur-ink: #1070B0;           --azur-tint: #E5F1FA;
  --turquoise: #00E6BF;      --turquoise-ink: #007A65;      --turquoise-tint: #DCFAF2;
  --soleil: #F09000;         --soleil-ink: #9A5800;         --soleil-tint: #FFF1DC;
  --lavande: #7766EE;        --lavande-ink: #5B49D6;        --lavande-tint: #EEECFE;
  --bougainvillier: #E0437C; --bougainvillier-ink: #BE2C62; --bougainvillier-tint: #FDE7EF;
  --olivier: #3E9762;        --olivier-ink: #2E7A4E;        --olivier-tint: #E3F4E9;
  --galet: #8E9BA8;          --galet-ink: #5A6B7C;          --galet-tint: #EEF1F4;
  --citron: #E7B416;         --citron-ink: #7A5D00;         --citron-tint: #FFF5D3;

  /* The main button is always turquoise with navy text, in both modes (CAPA's main-button colour). */
  --btn: #00E6BF;
  --on-btn: #103550;

  /* One colour per mode: the active tab, the back buttons and the links inside that mode. */
  --accueil: var(--soleil-ink);      --accueil-tint: var(--soleil-tint);
  --reviser: var(--turquoise-ink);   --reviser-tint: var(--turquoise-tint);
  --etudier: var(--lavande-ink);     --etudier-tint: var(--lavande-tint);   /* from Phase 5 */
  --planning: var(--azur-ink);       --planning-tint: var(--azur-tint);

  /* Type: one family, a small scale, weights 500 to 800 (800 only for big titles). */
  --font: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --t-hero: 800 40px/1.05 var(--font);      /* the welcome screen only */
  --t-display: 800 26px/1.15 var(--font);   /* page titles */
  --t-title: 700 17px/1.3 var(--font);      /* card and section titles */
  --t-body: 500 15px/1.45 var(--font);
  --t-strong: 650 15px/1.35 var(--font);    /* list rows */
  --t-small: 500 13px/1.4 var(--font);
  --t-micro: 650 11px/1.3 var(--font);      /* weekday letters, lesson numbers */

  /* Shape: the bigger the surface, the rounder. */
  --r-sheet: 28px;
  --r-hero: 24px;
  --r-card: 20px;
  --r-tile: 16px;
  --r-control: 12px;
  --r-pill: 999px;
  --shadow: 0 1px 2px rgba(16, 53, 80, .05), 0 10px 28px -14px rgba(16, 53, 80, .28);
  --gutter: 16px;
  --tabbar: 84px;   /* 54 px of tabs + the iPhone's home-indicator area */
}

/* ================= Design tokens: dark (in the app: @media (prefers-color-scheme: dark)) ================= */
.dark {
  --bg: #0B1A28;
  --surface: #132637;
  --surface-2: #1B3146;
  --line: #23394E;
  --ink: #EAF2F8;
  --ink-2: #A9BCCC;
  --ink-3: #7F98AD;
  --on-accent: #0B1A28;
  --scrim: rgba(0, 0, 0, .55);
  --azur: #3D9AE0;           --azur-ink: #7CC0F2;           --azur-tint: rgba(61, 154, 224, .18);
  --turquoise: #00E6BF;      --turquoise-ink: #41EDCF;      --turquoise-tint: rgba(0, 230, 191, .14);
  --soleil: #FF9F1C;         --soleil-ink: #FFB95C;         --soleil-tint: rgba(255, 159, 28, .16);
  --lavande: #8F82FF;        --lavande-ink: #B4ABFF;        --lavande-tint: rgba(143, 130, 255, .18);
  --bougainvillier: #FF5C93; --bougainvillier-ink: #FF8FB5; --bougainvillier-tint: rgba(255, 92, 147, .16);
  --olivier: #4FBF7F;        --olivier-ink: #86DAA8;        --olivier-tint: rgba(79, 191, 127, .16);
  --galet: #8E9BA8;          --galet-ink: #B9C4CF;          --galet-tint: rgba(142, 155, 168, .16);
  --citron: #F5CF4A;         --citron-ink: #F8DA74;         --citron-tint: rgba(245, 207, 74, .15);
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 12px 28px -16px rgba(0, 0, 0, .7);
}

/* ================= The board that holds the screens (not part of the app) ================= */
* { box-sizing: border-box; }
body { margin: 0; background: #D8E2EA; font-family: var(--font); color: var(--ink); -webkit-font-smoothing: antialiased; }
.board { display: grid; grid-template-columns: repeat(4, 390px); gap: 56px 40px; padding: 48px; width: max-content; }
.board figure { margin: 0; }
.board figcaption { font: 650 15px/1.4 var(--font); color: #34506A; margin: 0 0 12px 6px; }
.board .phone { border-radius: 38px; box-shadow: 0 40px 70px -40px rgba(16, 53, 80, .55); }
.board .wide { grid-column: 1 / -1; }

/* ================= Phone frame, status bar, home indicator ================= */
.phone { position: relative; width: 390px; height: 844px; overflow: hidden; background: var(--bg); color: var(--ink); font: var(--t-body); }
/* The app uses apple-mobile-web-app-status-bar-style "default": iOS draws the bar on a plain background
   with dark symbols (light symbols in dark mode), and the app starts below it. */
.status { position: absolute; inset: 0 0 auto 0; height: 47px; padding: 4px 26px 0 36px; display: flex; align-items: center; justify-content: space-between; font: 650 15px/1 var(--font); background: var(--bg); z-index: 8; }
.status__icons { display: flex; gap: 6px; align-items: center; }
.home-ind { position: absolute; left: 50%; bottom: 8px; width: 134px; height: 5px; margin-left: -67px; border-radius: 3px; background: var(--ink); z-index: 9; }
svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex: none; }
svg.i--s { width: 18px; height: 18px; }
svg.i--xs { width: 15px; height: 15px; stroke-width: 2.2; }
svg.i--fill { fill: currentColor; stroke: none; }

/* ================= Buttons, chips, controls ================= */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 48px; padding: 0 20px; border: 0; border-radius: 14px; font: 700 16px/1 var(--font); white-space: nowrap; }
.btn--primary { background: var(--btn); color: var(--on-btn); }
.btn--block { width: 100%; }
.btn--small { height: 34px; padding: 0 14px; border-radius: 10px; font: 700 13px/1 var(--font); }
.chip { display: inline-flex; align-items: center; gap: 5px; height: 30px; padding: 0 11px 0 9px; border-radius: var(--r-pill); font: 700 13px/1 var(--font); white-space: nowrap; }
.tag { display: inline-flex; align-items: center; height: 20px; padding: 0 7px; border-radius: 6px; font: 700 11px/1 var(--font); vertical-align: 2px; }
.icon-btn { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; border: 0; flex: none; }
.tile-icon { width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; flex: none; }
.switch { width: 46px; height: 28px; border-radius: 14px; background: var(--surface-2); border: 1px solid var(--line); position: relative; flex: none; }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(16, 53, 80, .3); }

/* ================= Tab bar: white and translucent; the active tab takes its mode colour =================
   Phase 3 has three tabs. Étudier comes back as the third tab, in lavande, in Phase 5. */
.tabbar { position: absolute; inset: auto 0 0 0; height: var(--tabbar); padding: 7px 18px 0; display: grid; grid-template-columns: repeat(3, 1fr); background: color-mix(in srgb, var(--surface) 90%, transparent); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-top: 1px solid var(--line); z-index: 6; }
.tab { display: flex; flex-direction: column; align-items: center; gap: 3px; font: 650 10.5px/1.1 var(--font); color: var(--ink-3); }
.tab__icon { width: 56px; height: 30px; border-radius: 15px; display: grid; place-items: center; }
.tab.is-on { color: var(--c); }
.tab.is-on .tab__icon { background: var(--t); }

/* ================= Shared page parts ================= */
.page { position: absolute; inset: 47px 0 var(--tabbar) 0; padding: 4px var(--gutter) 24px; overflow: hidden; }
.page--full { bottom: 0; }
.page-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 56px; }
.page-title { font: var(--t-display); letter-spacing: -.02em; margin: 0; }
.section-title { font: var(--t-title); margin: 22px 4px 10px; }
.navbar { display: flex; align-items: center; justify-content: space-between; height: 44px; margin: 0 -6px; }
.back { display: inline-flex; align-items: center; gap: 1px; font: 650 16px/1 var(--font); }
.card { background: var(--surface); border-radius: var(--r-card); box-shadow: var(--shadow); }
.list { background: var(--surface); border-radius: var(--r-card); box-shadow: var(--shadow); overflow: hidden; }
.row { display: flex; align-items: center; gap: 12px; padding: 13px 14px 13px 16px; min-height: 56px; }
.row + .row { border-top: 1px solid var(--line); }
.row__main { flex: 1; min-width: 0; }
.row__title { font: var(--t-strong); }
.muted { color: var(--ink-2); }
.faint { color: var(--ink-3); }
.small { font: var(--t-small); }
.chev { color: var(--ink-3); }
.bar { height: 5px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 3px; }
.slot-bar { width: 4px; align-self: stretch; border-radius: 2px; flex: none; }
.time { font: 700 15px/1.2 var(--font); font-variant-numeric: tabular-nums; white-space: nowrap; }

/* ================= 1. Bienvenue ================= */
.welcome__scene { position: absolute; inset: 47px 0 0 0; width: 100%; height: calc(100% - 47px); object-fit: cover; object-position: 50% 100%; }
.welcome__fade { position: absolute; inset: 47px 0 auto 0; height: 90px; background: linear-gradient(var(--bg), transparent); }
.welcome__brand { position: absolute; left: 28px; right: 28px; top: 112px; }
.welcome__title { font: var(--t-hero); letter-spacing: -.035em; margin: 0 0 12px; }
.welcome__sub { font: 500 17px/1.45 var(--font); color: #2E4D68; margin: 0; max-width: 300px; }
.welcome__cta { position: absolute; left: 24px; right: 24px; bottom: 30px; text-align: center; }
.welcome__note { font: var(--t-small); color: #6A7B8B; margin: 12px 0 0; }

/* ================= 2. Prénom (in Phase 4 this step becomes « Crée ton compte ») ================= */
.steps { display: flex; gap: 6px; }
.steps i { width: 22px; height: 5px; border-radius: 3px; background: var(--line); }
.steps i.on { background: var(--turquoise-ink); }
.mini-sky { width: 64px; height: 64px; border-radius: 20px; overflow: hidden; margin: 30px 0 22px; box-shadow: var(--shadow); }
.mini-sky img { width: 100%; height: 100%; object-fit: cover; object-position: 60% 66%; }
.field { margin-top: 24px; height: 54px; border-radius: 14px; background: var(--surface); border: 2px solid var(--turquoise-ink); display: flex; align-items: center; padding: 0 16px; font: 650 17px/1 var(--font); box-shadow: 0 0 0 4px var(--turquoise-tint); }
.caret { width: 2px; height: 22px; background: var(--turquoise-ink); margin-left: 2px; border-radius: 1px; }
.note { display: flex; gap: 12px; align-items: flex-start; margin-top: 16px; padding: 14px; border-radius: 14px; background: var(--surface-2); font: var(--t-small); color: var(--ink-2); }
.bottom-cta { position: absolute; left: var(--gutter); right: var(--gutter); bottom: 34px; }

/* ================= 3–4. Accueil: a « window » onto the Baie des Anges, then two cards ================= */
/* The window keeps the same shape at every width (aspect-ratio), so the crop is always the same:
   sky for the greeting, the hills, then a strip of sea. The palm stays out of the window. */
.hero { position: relative; aspect-ratio: 358 / 220; margin: 8px 0 14px; border-radius: var(--r-hero); overflow: hidden; }
.hero img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 54%; display: block; }
.hero__hello { position: absolute; left: 18px; top: 16px; }
.hero__hello h1 { font: 800 28px/1.1 var(--font); letter-spacing: -.03em; margin: 0 0 5px; color: #103550; }
.hero__hello p { font: 650 14px/1.3 var(--font); color: #24506F; margin: 0; }
.hero__me { position: absolute; right: 14px; top: 14px; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font: 800 15px/1 var(--font); background: rgba(255, 255, 255, .85); color: #103550; }
.hero--night .hero__hello h1, .hero--night .hero__hello p { color: #fff; }
.hero--night .hero__hello p { opacity: .85; }
.hero--night .hero__me { background: rgba(255, 255, 255, .16); color: #fff; }
.today { padding: 16px; }
.today__top { display: flex; gap: 12px; align-items: center; }
.today__next { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
.slot { display: flex; align-items: center; gap: 12px; }
.revise { margin-top: 14px; padding: 16px; }
.revise__stats { display: flex; gap: 8px; margin-bottom: 14px; align-items: center; }
.revise__lesson { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
.ring { width: 46px; height: 46px; flex: none; }

/* ================= 5. Réviser ================= */
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tile { background: var(--surface); border-radius: var(--r-tile); box-shadow: var(--shadow); padding: 14px; min-height: 138px; display: flex; flex-direction: column; }
.tile__title { font: 700 15px/1.3 var(--font); margin: 10px 0 0; }
.tile__foot { margin-top: auto; padding-top: 12px; }
.tile__foot small { display: flex; align-items: center; gap: 4px; margin-top: 7px; font: 600 12px/1 var(--font); color: var(--ink-3); }
.play { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; background: var(--btn); color: var(--on-btn); flex: none; }

/* ================= 6. Thème: a pushed page, with a back button ================= */
.theme-head { display: flex; gap: 14px; align-items: center; margin: 10px 0 4px; }
.theme-head .tile-icon { width: 52px; height: 52px; border-radius: 16px; }
.path { position: relative; margin-top: 26px; }
.path::before { content: ""; position: absolute; left: 29px; top: 64px; height: 84px; border-left: 2px dashed var(--line); }
.lesson { position: relative; display: flex; gap: 18px; align-items: flex-start; padding-bottom: 30px; }
.node { position: relative; width: 60px; height: 60px; border-radius: 50%; display: grid; place-items: center; flex: none; z-index: 1; }
.node--now { background: var(--surface); color: var(--bougainvillier-ink); box-shadow: var(--shadow); }
.node--now svg.ringbig { position: absolute; inset: -5px; width: 70px; height: 70px; }
.node--locked { background: var(--surface-2); color: var(--ink-3); }
.lesson__text { padding-top: 4px; flex: 1; }
.lesson__n { font: var(--t-micro); color: var(--ink-3); }
.lesson__title { font: var(--t-title); margin: 3px 0 2px; }

/* ================= 7. Question ================= */
.qbar { display: flex; align-items: center; gap: 12px; height: 56px; }
.qbar .bar { flex: 1; height: 8px; border-radius: 4px; }
.lives { display: inline-flex; align-items: center; gap: 4px; font: 750 15px/1 var(--font); color: var(--bougainvillier-ink); }
.q { font: 750 20px/1.35 var(--font); letter-spacing: -.01em; margin: 18px 2px 18px; }
.choice { display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 12px 14px; margin-bottom: 10px; border-radius: 14px; background: var(--surface); border: 1.5px solid var(--line); font: 600 15px/1.35 var(--font); }
.choice__mark { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; margin-left: auto; flex: none; }
.choice--right { background: var(--turquoise-tint); border-color: var(--turquoise-ink); }
.choice--right .choice__mark { background: var(--turquoise-ink); color: var(--on-accent); }
.choice--wrong { background: var(--bougainvillier-tint); border-color: var(--bougainvillier-ink); }
.choice--wrong .choice__mark { background: var(--bougainvillier-ink); color: var(--on-accent); }
.choice--dim { opacity: .55; }
.feedback { position: absolute; inset: auto 0 0 0; padding: 20px var(--gutter) 34px; border-radius: var(--r-sheet) var(--r-sheet) 0 0; background: var(--surface); box-shadow: 0 -12px 30px -18px rgba(16, 53, 80, .35); }
.feedback__head { display: flex; align-items: center; gap: 10px; font: 800 18px/1.2 var(--font); color: var(--bougainvillier-ink); }
.feedback__head span { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--bougainvillier-tint); }
.feedback p { margin: 10px 0 0; }
.feedback .btn { margin-top: 16px; background: var(--bougainvillier-ink); color: var(--on-accent); }

/* ================= 8. Profil ================= */
.me-big { display: flex; flex-direction: column; align-items: center; text-align: center; margin: 4px 0 18px; }
.me-big__avatar { width: 76px; height: 76px; border-radius: 50%; overflow: hidden; position: relative; box-shadow: var(--shadow); }
.me-big__avatar img { width: 100%; height: 100%; object-fit: cover; object-position: 62% 60%; }
.me-big__avatar b { position: absolute; inset: 0; display: grid; place-items: center; font: 800 30px/1 var(--font); color: #103550; }
.me-big h1 { font: 800 22px/1.2 var(--font); margin: 12px 0 2px; }
.group-title { font: 650 13px/1.3 var(--font); color: var(--ink-3); margin: 18px 4px 8px; }
.footer-note { font: var(--t-small); color: var(--ink-3); text-align: center; margin: 18px 20px 0; }

/* ================= 9–11. Planning ================= */
.seg { display: grid; grid-template-columns: repeat(3, 1fr); height: 36px; padding: 3px; margin-top: 2px; border-radius: var(--r-control); background: var(--surface-2); }
.seg span { display: grid; place-items: center; border-radius: 9px; font: 650 13px/1 var(--font); color: var(--ink-2); }
.seg span.on { background: var(--surface); color: var(--ink); font-weight: 750; box-shadow: 0 1px 3px rgba(16, 53, 80, .14); }
.seg--2 { grid-template-columns: 1fr 1fr; }
.weekhead { display: flex; align-items: center; justify-content: space-between; margin: 16px 4px 10px; }
.weekhead b { font: var(--t-title); }
.arrows { display: flex; gap: 6px; }
.arrows span { width: 30px; height: 30px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; box-shadow: 0 1px 3px rgba(16, 53, 80, .12); }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; padding: 10px 6px 8px; }
.day { display: flex; flex-direction: column; align-items: center; gap: 5px; }
.day small { font: var(--t-micro); color: var(--ink-3); }
.day b { width: 40px; height: 40px; border-radius: 13px; display: grid; place-items: center; font: 750 16px/1 var(--font); font-variant-numeric: tabular-nums; }
.day.off b { color: var(--ink-3); font-weight: 600; }
.day.on b { background: var(--azur-ink); color: var(--on-accent); }
.dots { display: flex; gap: 3px; height: 6px; }
.dots i { width: 6px; height: 6px; border-radius: 50%; }
.banner { display: flex; gap: 10px; align-items: flex-start; margin-top: 12px; padding: 12px 14px; border-radius: 14px; background: var(--citron-tint); font: var(--t-small); color: var(--ink-2); }
.banner b { color: var(--ink); font-weight: 700; }
.dayhead { font: var(--t-title); margin: 18px 4px 10px; }
.row__time { width: 46px; flex: none; font: 700 14px/1.25 var(--font); font-variant-numeric: tabular-nums; }
.row__time span { display: block; font: 500 13px/1.3 var(--font); color: var(--ink-3); }
.sheet { position: absolute; inset: auto 0 0 0; z-index: 7; background: var(--surface); border-radius: var(--r-sheet) var(--r-sheet) 0 0; padding: 10px 20px 34px; box-shadow: 0 -20px 40px -20px rgba(16, 53, 80, .4); }
.grabber { width: 38px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 14px; }
.scrim { position: absolute; inset: 0; background: var(--scrim); z-index: 6; }
.facts { margin: 16px 0 0; padding: 0; list-style: none; }
.facts li { display: flex; align-items: center; gap: 12px; padding: 9px 0; font: var(--t-strong); }
.facts li svg { color: var(--ink-3); }
.linked { margin-top: 18px; padding: 14px; border-radius: 16px; background: var(--surface-2); }
.datebox { width: 46px; flex: none; text-align: center; border-radius: 12px; padding: 7px 0 6px; }
.datebox b { display: block; font: 800 18px/1 var(--font); font-variant-numeric: tabular-nums; }
.datebox small { display: block; margin-top: 3px; font: 700 11px/1 var(--font); }
.month { font: 650 13px/1.3 var(--font); color: var(--ink-3); margin: 18px 4px 8px; }

/* ================= 12. Couleurs et texte (a reference panel, not a screen) ================= */
.swatches { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 10px; }
.sw { border-radius: 12px; overflow: hidden; background: var(--surface); box-shadow: var(--shadow); }
.sw i { display: block; height: 34px; }
.sw i + i { height: 14px; }
.sw small { display: block; padding: 6px 7px 7px; font: 650 10.5px/1.25 var(--font); color: var(--ink-2); }

/* ================= 13. The Accueil window across the day (a reference strip) ================= */
.skies { display: grid; grid-template-columns: repeat(4, 358px); gap: 72px; padding: 32px 16px 28px; border-radius: 38px; background: #F3F7FA; box-shadow: 0 40px 70px -40px rgba(16, 53, 80, .55); }
.skies .hero { margin: 0; }
.skies p.cap { font: var(--t-small); color: #4F6680; margin: 10px 4px 0; }
.skies p.cap b { color: #103550; }
</style>
</head>
