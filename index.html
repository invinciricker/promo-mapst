<!doctype html>
<!--
  Promo MAPST: the one and only page of the app.

  How the app is built (no framework, no build step):
    - this file holds the frame of the app: the header, the 4 screens and the tab bar;
    - css/   decides how it looks (colours and fonts are in css/01-tokens.css);
    - js/    decides how it works (js/app.js starts everything);
    - content/ holds the texts and data (the planning, the themes...);
    - sw.js  keeps a copy of the app on the phone so it works offline.
  The README explains every folder in plain English.
-->
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Promo MAPST</title>
  <meta name="description" content="Réviser, étudier et suivre le planning du BPJEPS MAPST (CAPA Sports, Nice, 2026-2027). Application non officielle.">

  <!-- Light or dark: the app follows the setting of the phone. -->
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#0D2E46" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#071824" media="(prefers-color-scheme: dark)">

  <!-- Installable app: name, icons, and full screen once added to the home screen. -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Promo MAPST">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- The font is stored in the app itself (vendor/fonts), so it also works offline. -->
  <link rel="preload" href="vendor/fonts/plus-jakarta-sans.woff2" as="font" type="font/woff2" crossorigin>

  <!-- Styles, loaded in this order. -->
  <link rel="stylesheet" href="css/01-tokens.css">
  <link rel="stylesheet" href="css/02-base.css">
  <link rel="stylesheet" href="css/03-components.css">
  <link rel="stylesheet" href="css/04-layout.css">
  <link rel="stylesheet" href="css/05-planning.css">
  <link rel="stylesheet" href="css/06-screens.css">
  <link rel="stylesheet" href="css/07-reviser.css">
</head>
<body>
  <!-- Icons: drawn once here, then reused everywhere with <svg><use href="#i-name"/></svg>. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-reviser" viewBox="0 0 24 24"><path d="M13.2 2.5 4.6 13.4a.6.6 0 0 0 .5 1h5.7l-1.2 7.1 8.6-10.9a.6.6 0 0 0-.5-1h-5.7z"/></symbol>
      <symbol id="i-etudier" viewBox="0 0 24 24"><path d="M2.5 5h5.8A3.7 3.7 0 0 1 12 8.7V20a2.8 2.8 0 0 0-2.8-2.8H2.5z"/><path d="M21.5 5h-5.8A3.7 3.7 0 0 0 12 8.7V20a2.8 2.8 0 0 1 2.8-2.8h6.7z"/></symbol>
      <symbol id="i-planning" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="16.5" rx="3.5"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/><path d="M7.5 13.5h.01M12 13.5h.01M16.5 13.5h.01M7.5 17h.01M12 17h.01"/></symbol>
      <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5"/><path d="M12 16.5v-5M12 8h.01"/></symbol>
      <symbol id="i-left" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
      <symbol id="i-right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="M17 7 7 17M7 7l10 10"/></symbol>
      <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.4"/></symbol>
      <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.8"/><path d="M4.5 20.5a7.5 7.5 0 0 1 15 0"/></symbol>
      <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5"/><path d="M12 7v5l3.2 2"/></symbol>
      <symbol id="i-alert" viewBox="0 0 24 24"><path d="M10.3 4.2 2.6 17.6A2 2 0 0 0 4.3 20.5h15.4a2 2 0 0 0 1.7-2.9L13.7 4.2a2 2 0 0 0-3.4 0z"/><path d="M12 9.5v4M12 17h.01"/></symbol>
      <symbol id="i-export" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="16.5" rx="3.5"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4M12 12.5v5.5M9.5 15.5 12 18l2.5-2.5"/></symbol>
      <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3.5v11M7.5 10 12 14.5 16.5 10M4.5 20h15"/></symbol>
      <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8.5" y="8.5" width="12" height="12" rx="2.5"/><path d="M15.5 8.5V6A2.5 2.5 0 0 0 13 3.5H6A2.5 2.5 0 0 0 3.5 6v7A2.5 2.5 0 0 0 6 15.5h2.5"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
      <symbol id="i-lock" viewBox="0 0 24 24"><rect x="4.5" y="10.5" width="15" height="10.5" rx="2.8"/><path d="M8 10.5V7.8a4 4 0 0 1 8 0v2.7"/></symbol>
      <symbol id="i-today" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7.5"/><circle cx="12" cy="12" r="2.6"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9.5 7V4.5h5V7M6.5 7l1 13h9l1-13"/></symbol>
      <symbol id="i-repeat" viewBox="0 0 24 24"><path d="M17 2.5 20.5 6 17 9.5"/><path d="M3.5 11V9.5A3.5 3.5 0 0 1 7 6h13.5"/><path d="M7 21.5 3.5 18 7 14.5"/><path d="M20.5 13v1.5A3.5 3.5 0 0 1 17 18H3.5"/></symbol>
      <symbol id="i-sparkles" viewBox="0 0 24 24"><path d="M10 3.5 11.8 8l4.5 1.8-4.5 1.8L10 16l-1.8-4.4L3.7 9.8 8.2 8z"/><path d="M18 14l.9 2.1 2.1.9-2.1.9L18 20l-.9-2.1-2.1-.9 2.1-.9z"/></symbol>
      <symbol id="i-phone" viewBox="0 0 24 24"><rect x="6.5" y="2.5" width="11" height="19" rx="2.8"/><path d="M11 18.5h2"/></symbol>
      <symbol id="i-share" viewBox="0 0 24 24"><path d="M12 3.5v11M8 7.5l4-4 4 4"/><path d="M6 11H5.5A1.5 1.5 0 0 0 4 12.5v7A1.5 1.5 0 0 0 5.5 21h13a1.5 1.5 0 0 0 1.5-1.5v-7a1.5 1.5 0 0 0-1.5-1.5H18"/></symbol>
      <symbol id="i-more" viewBox="0 0 24 24"><path d="M12 5h.01M12 12h.01M12 19h.01"/></symbol>
      <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></symbol>
      <symbol id="i-award" viewBox="0 0 24 24"><circle cx="12" cy="9" r="5.5"/><path d="M8.6 13.4 7.5 21l4.5-2.6 4.5 2.6-1.1-7.6"/></symbol>
      <symbol id="i-coffee" viewBox="0 0 24 24"><path d="M4.5 9.5h12v4a5 5 0 0 1-5 5h-2a5 5 0 0 1-5-5z"/><path d="M16.5 11h1.3a2.3 2.3 0 0 1 0 4.6h-1.6M8 3v3M12 3v3"/></symbol>
      <symbol id="i-flag" viewBox="0 0 24 24"><path d="M5 21V4.5M5 4.5h11.5l-2 4 2 4H5"/></symbol>
      <symbol id="i-layers" viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5z"/><path d="m3 13 9 5 9-5"/></symbol>
      <!-- Réviser -->
      <symbol id="i-flame" viewBox="0 0 24 24"><path d="M12 2.8c.6 3 2.6 4.6 4.1 6.4 1.4 1.7 2.4 3.4 2.4 5.6a6.5 6.5 0 0 1-13 0c0-2.4 1.2-4.2 2.6-5.6.3 1.4 1 2.4 2 2.8C9.6 9 10.2 5.4 12 2.8z"/><path d="M12 21.3a3 3 0 0 1-3-3c0-1.6 1.2-2.7 3-4.5 1.8 1.8 3 2.9 3 4.5a3 3 0 0 1-3 3z"/></symbol>
      <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20.6s-7.8-4.6-9.2-9.6C1.9 7.6 4 4.4 7.3 4.4c2 0 3.6 1.1 4.7 2.7 1.1-1.6 2.7-2.7 4.7-2.7 3.3 0 5.4 3.2 4.5 6.6-1.4 5-9.2 9.6-9.2 9.6z"/></symbol>
      <symbol id="i-bulb" viewBox="0 0 24 24"><path d="M9 18.5h6M10 21.5h4"/><path d="M12 2.8a6.2 6.2 0 0 0-3.8 11.1c.7.6 1.1 1.4 1.1 2.3v.3h5.4v-.3c0-.9.4-1.7 1.1-2.3A6.2 6.2 0 0 0 12 2.8z"/></symbol>
      <symbol id="i-volume" viewBox="0 0 24 24"><path d="M4.5 9.5h3l4.5-4v13l-4.5-4h-3z"/><path d="M15.5 9a4.2 4.2 0 0 1 0 6M18.2 6.5a8 8 0 0 1 0 11"/></symbol>
      <symbol id="i-mute" viewBox="0 0 24 24"><path d="M4.5 9.5h3l4.5-4v13l-4.5-4h-3z"/><path d="m16 9.5 5 5M21 9.5l-5 5"/></symbol>
    </defs>
  </svg>

  <!-- The coloured header: today's date and the title of the screen. -->
  <header class="appbar" id="appbar">
    <div class="appbar__glow" aria-hidden="true"></div>
    <div class="appbar__inner wrap">
      <div class="appbar__text">
        <p class="appbar__date" id="appbar-date"></p>
        <h1 class="appbar__title" id="appbar-title">Promo MAPST</h1>
      </div>
      <button type="button" class="icon-btn icon-btn--glass" id="btn-infos" aria-label="Infos sur l’appli">
        <svg class="icon"><use href="#i-info"/></svg>
      </button>
    </div>
  </header>

  <!-- Small bar that appears at the top when you scroll down. -->
  <div class="topbar" id="topbar" aria-hidden="true">
    <span class="topbar__title" id="topbar-title"></span>
  </div>

  <!-- The 4 screens. Only one is visible at a time (see js/core/router.js). -->
  <main class="screens">
    <section class="screen" id="screen-reviser" data-screen="reviser" aria-labelledby="tab-reviser" hidden></section>
    <section class="screen" id="screen-etudier" data-screen="etudier" aria-labelledby="tab-etudier" hidden></section>
    <section class="screen" id="screen-planning" data-screen="planning" aria-labelledby="tab-planning" hidden></section>
    <section class="screen" id="screen-infos" data-screen="infos" aria-label="Infos" hidden></section>
  </main>

  <!-- The bottom bar with the 3 modes (on a laptop it becomes a side bar). -->
  <nav class="tabbar" aria-label="Modes de l’appli">
    <div class="tabbar__inner" role="tablist">
      <button type="button" class="tab" role="tab" id="tab-reviser" data-tab="reviser" aria-controls="screen-reviser">
        <span class="tab__icon"><svg class="icon"><use href="#i-reviser"/></svg></span><span class="tab__label">Réviser</span>
      </button>
      <button type="button" class="tab" role="tab" id="tab-etudier" data-tab="etudier" aria-controls="screen-etudier">
        <span class="tab__icon"><svg class="icon"><use href="#i-etudier"/></svg></span><span class="tab__label">Étudier</span>
      </button>
      <button type="button" class="tab" role="tab" id="tab-planning" data-tab="planning" aria-controls="screen-planning">
        <span class="tab__icon"><svg class="icon"><use href="#i-planning"/></svg></span><span class="tab__label">Planning</span>
      </button>
    </div>
  </nav>

  <!-- Message shown when the app cannot start at all (very old browser). -->
  <noscript><p class="noscript">Promo MAPST a besoin de JavaScript pour fonctionner.</p></noscript>

  <!-- Bottom sheets (details, forms...) and small messages are added here by the code. -->
  <div id="layers"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
