<!doctype html>
<!--
  Promo MAPST: the one and only page of the app.

  How the app is built (no framework, no build step):
    - this file holds the frame of the app: the icons, the tab bar and one empty
      "panel" per tab; the pages are drawn inside by the code;
    - css/   decides how it looks (colours, font and sizes are in css/01-tokens.css);
    - js/    decides how it works (js/app.js starts everything);
    - content/ holds the texts and data (the planning, the questions...);
    - img/   the illustrations (« la Baie »);
    - sw.js  keeps a copy of the app on the phone so it works offline.
  The README explains every folder in plain English.
-->
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Promo MAPST</title>
  <meta name="description" content="Réviser et suivre le planning du BPJEPS MAPST (CAPA Sports, Nice, 2026-2027). Application non officielle.">

  <!-- Light or dark: the app follows the setting of the phone. The status bar of Android
       takes the colour of the top of the screen shown: the app changes this value as you
       move around (js/core/statusbar.js). -->
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#0A5489">

  <!-- Installable app: name, icons, and full screen once added to the home screen.
       Status bar "black-translucent": the app draws under the clock of the iPhone, which
       is white. So the top of every screen is coloured (the sky, a header, a small bar). -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Promo MAPST">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- iPhone launch images (the welcome screen), made by scripts/make_launch_images.cjs. -->
  <!-- launch-images:start -->
  <link rel="apple-touch-startup-image" href="icons/launch/launch-1320x2868.png" media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="icons/launch/launch-1290x2796.png" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="icons/launch/launch-1284x2778.png" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="icons/launch/launch-1260x2736.png" media="(device-width: 420px) and (device-height: 912px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="icons/launch/launch-1242x2688.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="icons/launch/launch-828x1792.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="icons/launch/launch-1206x2622.png" media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="icons/launch/launch-1179x2556.png" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="icons/launch/launch-1170x2532.png" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="icons/launch/launch-1125x2436.png" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="icons/launch/launch-750x1334.png" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)">
  <!-- launch-images:end -->

  <!-- The font is stored in the app itself (vendor/fonts), so it also works offline. -->
  <link rel="preload" href="vendor/fonts/plus-jakarta-sans.woff2" as="font" type="font/woff2" crossorigin>

  <!-- Styles, loaded in this order. -->
  <link rel="stylesheet" href="css/01-tokens.css">
  <link rel="stylesheet" href="css/02-base.css">
  <link rel="stylesheet" href="css/03-components.css">
  <link rel="stylesheet" href="css/04-layout.css">
  <link rel="stylesheet" href="css/05-planning.css">
  <link rel="stylesheet" href="css/06-screens.css">
  <link rel="stylesheet" href="css/07-reviser.css">
  <link rel="stylesheet" href="css/08-accueil.css">
  <link rel="stylesheet" href="css/09-cours.css">
  <link rel="stylesheet" href="css/10-lecons.css">
</head>
<body>

      <symbol id="i-swatch" viewBox="0 0 24 24"><circle cx="8.2" cy="9" r="4.4"/><circle cx="15.8" cy="9" r="4.4"/><circle cx="12" cy="15.6" r="4.4"/></symbol>
      <symbol id="i-gift" viewBox="0 0 24 24"><rect x="3.6" y="8.4" width="16.8" height="4.4" rx="1.4"/><path d="M5.2 12.8v6.4a1.6 1.6 0 0 0 1.6 1.6h10.4a1.6 1.6 0 0 0 1.6-1.6v-6.4M12 8.4v12.4M12 8.4C10.6 5 7 4.6 7 6.6S10 8.4 12 8.4zM12 8.4c1.4-3.4 5-3.8 5-1.8s-3 1.8-5 1.8z"/></symbol>
      <!-- Profil, notes, sharing -->
      <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.6"/><path d="M12 11v5.2M12 7.9v.1"/></symbol>
      <symbol id="i-phone" viewBox="0 0 24 24"><rect x="6.6" y="2.8" width="10.8" height="18.4" rx="2.8"/><path d="M10.6 17.8h2.8"/></symbol>

  <div class="app" id="app" data-tab="accueil">
    <!-- One panel per tab. The pages are drawn inside by js/core/nav.js. -->
    <main class="panels">
      <section class="panel m-accueil" data-tab="accueil" aria-label="Accueil"></section>
      <section class="panel m-cours" data-tab="cours" aria-label="Cours" hidden></section>
      <section class="panel m-reviser" data-tab="reviser" aria-label="Réviser" hidden></section>
      <section class="panel m-planning" data-tab="planning" aria-label="Planning" hidden></section>
    </main>

    <!-- The tab bar: a glass capsule that floats at the bottom (a side rail on a laptop).
         The « lens » slides under the icon of the tab shown. -->
    <nav class="tabbar" aria-label="Onglets de l’appli" role="tablist">
      <i class="tabbar__lens" aria-hidden="true"></i>
      <button type="button" class="tab m-accueil is-on" role="tab" data-tab="accueil" aria-selected="true">
        <span class="tab__icon"><svg class="icon" aria-hidden="true"><use href="#i-home"/></svg></span>Accueil
      </button>
      <button type="button" class="tab m-cours" role="tab" data-tab="cours" aria-selected="false">
        <span class="tab__icon"><svg class="icon" aria-hidden="true"><use href="#i-book"/></svg></span>Cours
      </button>
      <button type="button" class="tab m-reviser" role="tab" data-tab="reviser" aria-selected="false">
        <span class="tab__icon"><svg class="icon" aria-hidden="true"><use href="#i-bolt"/></svg></span>Réviser
      </button>
      <button type="button" class="tab m-planning" role="tab" data-tab="planning" aria-selected="false">
        <span class="tab__icon"><svg class="icon" aria-hidden="true"><use href="#i-cal"/></svg></span>Planning
      </button>
    </nav>
  </div>

  <!-- Message shown when the app cannot start at all (very old browser). -->
  <noscript><p class="noscript">Promo MAPST a besoin de JavaScript pour fonctionner.</p></noscript>

  <!-- Sheets, the lesson screen, the welcome and small messages are added here by the code. -->
  <div id="layers"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
